---
layout: default
---
<article class="doc">
  <header class="doc-head">
    <h1>{{ page.title }}</h1>
    {% if page.summary %}<p class="doc-summary">{{ page.summary }}</p>{% endif %}
  </header>
  <div class="doc-body">
    <aside class="doc-meta">
      {% if page.show_facts %}{% include facts.html %}{% endif %}
    </aside>
    <div class="prose">
      {{ content }}
    </div>
  </div>
</article>
